name: CI — Terraform Plan

on:
  pull_request:
    branches:
      - master

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('terraform show -no-color tfplan').toString();

            const fmtStatus  = '${{ steps.fmt.outcome }}';
            const initStatus = '${{ steps.init.outcome }}';
            const valStatus  = '${{ steps.validate.outcome }}';
            const planStatus = '${{ steps.plan.outcome }}';

            const statusIcon = s => s === 'success' ? '✅' : '❌';

            const body = `## Terraform Plan
            | Step | Status |
            |------|--------|
            | Format | ${statusIcon(fmtStatus)} \`${fmtStatus}\` |
            | Init | ${statusIcon(initStatus)} \`${initStatus}\` |
            | Validate | ${statusIcon(valStatus)} \`${valStatus}\` |
            | Plan | ${statusIcon(planStatus)} \`${planStatus}\` |

            <details>
            <summary>Plan Output</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>

            *Triggered by @${{ github.actor }} on \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
